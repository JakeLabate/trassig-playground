name: Vendor brand assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set +e
          mkdir -p "$(dirname 'img/logo.png')"
          echo 'Fetching img/logo.png'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/logo.png' 'https://trassig.com/cdn/shop/files/trassig-logo-410x90_400x.png?v=1613700393' || echo '  MISS img/logo.png'
          mkdir -p "$(dirname 'img/logo-lg.png')"
          echo 'Fetching img/logo-lg.png'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/logo-lg.png' 'https://trassig.com/cdn/shop/files/trassig-logo-410x90_1200x.png?v=1613700393' || echo '  MISS img/logo-lg.png'
          mkdir -p "$(dirname 'img/inspection-ct.jpg')"
          echo 'Fetching img/inspection-ct.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/inspection-ct.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/inspections-1_large.jpg?v=1528991901' || echo '  MISS img/inspection-ct.jpg'
          mkdir -p "$(dirname 'img/inspection-ny.jpg')"
          echo 'Fetching img/inspection-ny.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/inspection-ny.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/inspections-2_large.jpg?v=1528992067' || echo '  MISS img/inspection-ny.jpg'
          mkdir -p "$(dirname 'img/warehouse.jpg')"
          echo 'Fetching img/warehouse.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/warehouse.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/warehouse_inside_outside_large.jpg?v=1530633440' || echo '  MISS img/warehouse.jpg'
          mkdir -p "$(dirname 'img/determined.png')"
          echo 'Fetching img/determined.png'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/determined.png' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/determined_large.png?v=1529597463' || echo '  MISS img/determined.png'
          mkdir -p "$(dirname 'img/video-pip-repair.jpg')"
          echo 'Fetching img/video-pip-repair.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/video-pip-repair.jpg' 'https://trassig.com/cdn/shop/files/YT1-How-to-Repair-Your-Poured-In-Surface_300x.jpg?v=1613717294' || echo '  MISS img/video-pip-repair.jpg'
          mkdir -p "$(dirname 'img/video-rebinder.jpg')"
          echo 'Fetching img/video-rebinder.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/video-rebinder.jpg' 'https://trassig.com/cdn/shop/files/YT2-Apply-Rebinder_300x.jpg?v=1613717295' || echo '  MISS img/video-rebinder.jpg'
          mkdir -p "$(dirname 'img/video-turf-repair.jpg')"
          echo 'Fetching img/video-turf-repair.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/video-turf-repair.jpg' 'https://trassig.com/cdn/shop/files/YT4-How-to-Repair-Synthetic-Turf_300x.jpg?v=1613717295' || echo '  MISS img/video-turf-repair.jpg'
          mkdir -p "$(dirname 'img/video-turf-install.jpg')"
          echo 'Fetching img/video-turf-install.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/video-turf-install.jpg' 'https://trassig.com/cdn/shop/files/YT5-Install-Synthetic-Turf_300x.jpg?v=1613717295' || echo '  MISS img/video-turf-install.jpg'
          mkdir -p "$(dirname 'img/kb-pip-repair.jpg')"
          echo 'Fetching img/kb-pip-repair.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-pip-repair.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/Z_PIP_1024x1024.jpg?v=1530546086' || echo '  MISS img/kb-pip-repair.jpg'
          mkdir -p "$(dirname 'img/kb-rebinder.jpg')"
          echo 'Fetching img/kb-rebinder.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-rebinder.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/rebinder_1024x1024.jpg?v=1530546332' || echo '  MISS img/kb-rebinder.jpg'
          mkdir -p "$(dirname 'img/kb-extender.jpg')"
          echo 'Fetching img/kb-extender.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-extender.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/pip_extender_1024x1024.jpg?v=1530545425' || echo '  MISS img/kb-extender.jpg'
          mkdir -p "$(dirname 'img/kb-base-layer.jpg')"
          echo 'Fetching img/kb-base-layer.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-base-layer.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/base_layer_repair_1024x1024.jpg?v=1530545780' || echo '  MISS img/kb-base-layer.jpg'
          mkdir -p "$(dirname 'img/kb-gaps.jpg')"
          echo 'Fetching img/kb-gaps.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-gaps.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/filling_gaps_1024x1024.jpg?v=1530545595' || echo '  MISS img/kb-gaps.jpg'
          mkdir -p "$(dirname 'img/kb-turf-install.jpg')"
          echo 'Fetching img/kb-turf-install.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-turf-install.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/installing_turf_1024x1024.jpg?v=1530546255' || echo '  MISS img/kb-turf-install.jpg'
          mkdir -p "$(dirname 'img/kb-turf-hole.jpg')"
          echo 'Fetching img/kb-turf-hole.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-turf-hole.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/fill_hole_in_turf_1024x1024.jpg?v=1530545889' || echo '  MISS img/kb-turf-hole.jpg'
          mkdir -p "$(dirname 'img/kb-sunken-turf.jpg')"
          echo 'Fetching img/kb-sunken-turf.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-sunken-turf.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/sunken_turf_1024x1024.jpg?v=1530545256' || echo '  MISS img/kb-sunken-turf.jpg'
          mkdir -p "$(dirname 'img/kb-shade.jpg')"
          echo 'Fetching img/kb-shade.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-shade.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/shade_1024x1024.jpg?v=1530545992' || echo '  MISS img/kb-shade.jpg'
          mkdir -p "$(dirname 'img/kb-deterioration.png')"
          echo 'Fetching img/kb-deterioration.png'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/kb-deterioration.png' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/articles/PIP_deterioration_ec2419e5-f747-4897-944d-6d0163be5f49_1024x1024.png?v=1530647541' || echo '  MISS img/kb-deterioration.png'
          mkdir -p "$(dirname 'img/surf-pip.jpg')"
          echo 'Fetching img/surf-pip.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-pip.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/products/poured-in-place-rubber_grande.jpg' || echo '  MISS img/surf-pip.jpg'
          mkdir -p "$(dirname 'img/surf-mulch.jpg')"
          echo 'Fetching img/surf-mulch.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-mulch.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/products/Blue_Rubber_Mulch_2048x2048.jpg' || echo '  MISS img/surf-mulch.jpg'
          mkdir -p "$(dirname 'img/surf-ewf.jpg')"
          echo 'Fetching img/surf-ewf.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-ewf.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/products/engineered-wood-fiber_1024x1024.jpg' || echo '  MISS img/surf-ewf.jpg'
          mkdir -p "$(dirname 'img/surf-tile.jpg')"
          echo 'Fetching img/surf-tile.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-tile.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/sidea_480x480.jpg?v=1709435639' || echo '  MISS img/surf-tile.jpg'
          mkdir -p "$(dirname 'img/surf-bonded.jpg')"
          echo 'Fetching img/surf-bonded.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-bonded.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/Bonded-Repair-Kit_2048x2048_49874c8a-876d-4eb4-8142-bca07ec16e4b.jpg?v=1589904131' || echo '  MISS img/surf-bonded.jpg'
          mkdir -p "$(dirname 'img/surf-padding.jpg')"
          echo 'Fetching img/surf-padding.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/surf-padding.jpg' 'https://cdn.shopify.com/s/files/1/0012/1975/6093/files/padding_480x480.jpg?v=1710179806' || echo '  MISS img/surf-padding.jpg'
      - name: Drop anything that is not a real image
        run: |
          for f in $(git status --porcelain --untracked-files=all | awk '{print $2}'); do
            case "$f" in .github/*) continue;; esac
            if [ -f "$f" ]; then
              t=$(file -b --mime-type "$f")
              case "$t" in
                image/*|font/*|application/font*) : ;;
                text/xml|application/xml|text/plain)
                  # SVG is reported inconsistently across `file` versions.
                  if head -c 1024 "$f" | grep -qi '<svg'; then :; else
                    echo "  DROP $f ($t, not an svg)"; rm -f "$f"; fi ;;
                *) echo "  DROP $f ($t)"; rm -f "$f" ;;
              esac
            fi
          done
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet && echo 'nothing vendored' && exit 0
          git commit -m 'Vendor brand assets'
          git push
